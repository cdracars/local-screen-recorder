<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A private browser-based screen recorder. Record your screen locally with no uploads.">
  <link rel="canonical" href="https://screen-recorder.dracars.com/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Local Screen Recorder – Private Browser Recording">
  <meta property="og:description" content="Record your screen locally in the browser with no uploads.">
  <meta property="og:url" content="https://screen-recorder.dracars.com/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Local Screen Recorder – Private Browser Recording | Dracars</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Local Screen Recorder</h1>
    <p>Click Start, then choose a screen or window in your browser's sharing dialog. Nothing is uploaded.</p>
    <label><input id="audio" type="checkbox"> Include system audio if the browser offers it</label>
    <div class="actions">
      <button id="start">Start recording</button>
      <button id="stop" disabled>Stop and save</button>
    </div>
    <div id="status" role="status" aria-live="polite">Ready.</div>
    <small>Keep this tab open while recording. Your browser saves the finished video to its Downloads folder.</small>
    <a class="support-link" href="https://ko-fi.com/cdracars66494" target="_blank" rel="noreferrer">
      <img src="https://storage.ko-fi.com/cdn/cup-border.png" alt="" width="24" height="16">
      Support this free tool on Ko-fi
    </a>
  </main>
  <script type="module" src="recorder.js"></script>
</body>
</html>
